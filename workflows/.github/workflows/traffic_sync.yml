name: Update Canyon Traffic
on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allows manual "Run Workflow" button press

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: gives the robot permission to save files
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Execute Scraper
        run: python traffic_engine.py

      - name: Commit Results
        run: |
          git config --global user.name "TrafficBot"
          git config --global user.email "trafficbot@github.com"
          git add data.json
          git commit -m "Automated Update: $(date)" || exit 0
          git push
