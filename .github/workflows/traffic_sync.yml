name: Google Maps Sync
on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch:      # This creates the "Run" button

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Tools
        run: |
          pip install playwright
          playwright install chromium

      - name: Execute Scraper
        run: python traffic_engine.py

      - name: Save Data
        run: |
          git config --global user.name "TrafficBot"
          git config --global user.email "bot@powdertraffic.com"
          git add data.json
          git commit -m "Update Traffic Times" || exit 0
          # This line pulls the latest changes (like UDOT updates) and puts your changes on top
          git pull --rebase origin main
          git push origin main
