- name: UDOT GIS
        run: |
          git config --global user.name "TrafficBot"
          git config --global user.email "bot@powdertraffic.com"
          
          # 1. Fetch the latest data from your other script first
          git fetch origin main
          
          # 2. Pull the changes (this keeps cameras/conditions safe)
          git pull --rebase origin main
          
          # 3. NOW add your new drive times from traffic_engine.py
          git add data.json
          
          # 4. Commit and Push
          git commit -m "Update Drive Times [Skip CI]" || echo "No changes to commit"
          git push origin main
