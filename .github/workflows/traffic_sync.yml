name: UDOT Drive Time Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Dependencies
        run: pip install requests
      - name: Run Scraper
        run: python traffic_engine.py
      - name: Commit Changes
        run: |
          git config --global user.name "TrafficBot"
          git config --global user.email "bot@powdertraffic.com"
          git add data.json
          git pull --rebase origin main
          git commit -m "Update Drive Times" || exit 0
          git push origin main
