
name: Update Traffic Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch_data.py
        env:
          UDOT_API_KEY: ${{ secrets.UDOT_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "TrafficBot"
          git config user.email "bot@powdertraffic.com"
          if ! git diff --quiet; then
            git add data.json
            git commit -m "Auto-update traffic data ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push
          else
            echo "No changes to commit."
