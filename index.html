<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POWDERTRAFFIC // WATCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; }
        #map { height: 100%; width: 100%; border: 1px solid #14532d; background: #000 !important; }
        .leaflet-interactive { filter: drop-shadow(0 0 8px currentColor); transition: stroke 0.5s ease; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .live-indicator { animation: pulse 2s infinite; }
        .camera-feed { transition: all 0.3s ease; border: 1px solid #14532d; background: #000; }
        .camera-feed:hover { border-color: #00ff41; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); }
        .leaflet-popup-content-wrapper { background: #000; color: #00ff41; border: 1px solid #00ff41; border-radius: 0; }
        .leaflet-popup-tip { background: #00ff41; }
    </style>
</head>
<body class="p-4 max-w-6xl mx-auto">
    <header class="mb-8 border-b border-green-900 pb-4 flex justify-between items-end">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-tighter text-white uppercase italic">Powdertraffic // Watch</h1>
            <p class="text-xs text-green-600 tracking-[0.2em]">CANYON SURVEILLANCE V3.0</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-gray-400">MAP_ENGINE: <span class="text-green-500">STABLE</span></p>
            <span class="live-indicator inline-block w-2 h-2 bg-red-500 rounded-full"></span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="border border-green-900 p-6 bg-black/50">
            <h2 class="text-xl mb-6 underline decoration-green-700 decoration-2 underline-offset-8 uppercase">Canyon_Status</h2>
            
            <div class="flex justify-between items-center mb-8 border-b border-green-900/30 pb-6">
                <div>
                    <p class="text-[10px] text-gray-500 mb-2 uppercase">SR-210 (LITTLE COTTONWOOD)</p>
                    <span id="lcc-status" class="px-3 py-1 bg-gray-800 text-gray-400 font-bold text-sm border border-gray-600">SYNCING...</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-500 mb-1 italic uppercase">Est_Drive</p>
                    <span id="lcc-time" class="text-3xl font-bold text-white tracking-tighter">--</span><span class="text-xs ml-1 text-green-700">MIN</span>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <div>
                    <p class="text-[10px] text-gray-500 mb-2 uppercase">SR-190 (BIG COTTONWOOD)</p>
                    <span id="bcc-status" class="px-3 py-1 bg-gray-800 text-gray-400 font-bold text-sm border border-gray-600">SYNCING...</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-500 mb-1 italic uppercase">Est_Drive</p>
                    <span id="bcc-time" class="text-3xl font-bold text-white tracking-tighter">--</span><span class="text-xs ml-1 text-green-700">MIN</span>
                </div>
            </div>
            <p id="last-update" class="text-[10px] text-gray-600 mt-8 uppercase tracking-widest">CONNECTING_TO_DATA_STREAM...</p>
        </div>

        <div class="border border-green-900 bg-black p-1 h-96 relative">
            <div id="map"></div>
        </div>
    </div>

    <div class="mt-6 border border-green-900 bg-black p-6">
        <h3 class="text-lg mb-4 text-white italic uppercase tracking-widest">Surveillance_Grid</h3>
        <div id="cam-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>

    <script>
        // 1. Map Setup
        var map = L.map('map', { zoomControl: false }).setView([40.61, -111.70], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 2. Tactical Route Geometry (Hardcoded GPS Paths - WILL NOT DISAPPEAR)
        const bccCoords = [
            [40.638, -111.808], [40.628, -111.777], [40.617, -111.748], [40.614, -111.722],
            [40.627, -111.688], [40.643, -111.666], [40.655, -111.636], [40.641, -111.597],
            [40.603, -111.583], [40.598, -111.583]
        ];
        const lccCoords = [
            [40.575, -111.805], [40.572, -111.780], [40.568, -111.748], [40.568, -111.713],
            [40.574, -111.681], [40.583, -111.656], [40.589, -111.638], [40.588, -111.594]
        ];

        var bccLine = L.polyline(bccCoords, { color: '#14532d', weight: 8, opacity: 0.9, lineJoin: 'round' }).addTo(map);
        var lccLine = L.polyline(lccCoords, { color: '#14532d', weight: 8, opacity: 0.9, lineJoin: 'round' }).addTo(map);

        let cameraLayer = L.layerGroup().addTo(map);

        // 3. Update Function
        async function updateDashboard() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();

                updateStatus('lcc-status', data.canyons.lcc.status, lccLine);
                updateStatus('bcc-status', data.canyons.bcc.status, bccLine);

                if (data.drive_times) {
                    document.getElementById('lcc-time').innerText = data.drive_times.lcc || "--";
                    document.getElementById('bcc-time').innerText = data.drive_times.bcc || "--";
                }
                
                document.getElementById('last-update').innerText = "LAST_SYNC: " + data.metadata.last_updated;
                updateCameraSystem(data.cameras);

            } catch (error) {
                console.log("WAITING_FOR_DATA...");
            }
        }

        function updateStatus(id, status, line) {
            const el = document.getElementById(id);
            el.innerText = status.toUpperCase();
            
            let color = '#444';
            if (status.includes("Dry") || status.includes("Clear")) color = '#00ff41';
            else if (status.includes("Wet") || status.includes("Fair")) color = '#fbbf24';
            else color = '#ef4444';

            // Change UI colors
            el.className = `px-3 py-1 font-bold text-sm border uppercase ${color === '#00ff41' ? 'bg-green-900/20 text-[#00ff41] border-[#00ff41]' : (color === '#fbbf24' ? 'bg-yellow-900/20 text-yellow-400 border-yellow-500' : 'bg-red-900/20 text-red-500 border-red-500')}`;
            
            // Update the Permanent Line color
            line.setStyle({ color: color });
        }

        function updateCameraSystem(cameras) {
            cameraLayer.clearLayers();
            const grid = document.getElementById('cam-grid');
            grid.innerHTML = ""; 

            cameras.forEach((cam, index) => {
                L.circleMarker([cam.lat, cam.lng], {
                    radius: 5, fillColor: "#00ff41", color: "#000", weight: 2, fillOpacity: 1
                }).bindPopup(`<div style="color:#00ff41; background:#000; padding:5px; border:1px solid #00ff41;"><b>${cam.name}</b><br><img src="${cam.image}" width="200" style="margin-top:5px;"></div>`).addTo(cameraLayer);

                if (index < 4) {
                    grid.innerHTML += `
                        <div class="camera-feed p-1 group">
                            <div class="bg-green-900/80 text-black text-[9px] px-2 py-1 font-bold flex justify-between uppercase">
                                <span>${cam.name}</span>
                                <span class="group-hover:text-white">● LIVE</span>
                            </div>
                            <img src="${cam.image}" referrerpolicy="no-referrer" class="w-full grayscale hover:grayscale-0 transition-all duration-300">
                        </div>`;
                }
            });
        }

        setInterval(updateDashboard, 30000);
        updateDashboard();
    </script>
</body>
</html>
