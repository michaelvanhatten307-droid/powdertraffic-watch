<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowderTraffic Watch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #0a0a0a; color: #00ff41; font-family: monospace; }
        #map { height: 300px; border: 1px solid #333; }
        /* A subtle pulse animation for the status lights */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .live-indicator { animation: pulse 2s infinite; }
    </style>
</head>
<body class="p-4 max-w-6xl mx-auto">
    
    <header class="mb-8 border-b border-green-900 pb-4 flex justify-between items-end">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-tighter text-white">POWDERTRAFFIC//WATCH</h1>
            <p class="text-xs text-green-600">LIVE CANYON MONITORING SYSTEM</p>
        </div>
        <div class="text-right">
            <p id="clock" class="text-xs text-gray-400">SYSTEM_STATUS: ACTIVE</p>
            <span class="live-indicator inline-block w-2 h-2 bg-red-500 rounded-full"></span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="border border-green-900 p-6 bg-black relative">
            <h2 class="text-xl mb-6 underline decoration-green-700 decoration-2 underline-offset-4">CANYON_STATUS</h2>
            
            <div class="flex justify-between items-center mb-6 border-b border-green-900/30 pb-4">
                <div>
                    <p class="text-[10px] text-gray-500 mb-1">SR-210 (LITTLE COTTONWOOD)</p>
                    <span id="lcc-status" class="px-2 py-1 bg-gray-800 text-white font-bold text-sm tracking-widest border border-gray-600">LOADING</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-500 mb-1">EST. TIME</p>
                    <span id="lcc-time" class="text-3xl font-bold text-white">--</span>
                    <span class="text-sm text-gray-500">min</span>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-gray-500 mb-1">SR-190 (BIG COTTONWOOD)</p>
                    <span id="bcc-status" class="px-2 py-1 bg-gray-800 text-white font-bold text-sm tracking-widest border border-gray-600">LOADING</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-500 mb-1">EST. TIME</p>
                    <span id="bcc-time" class="text-3xl font-bold text-white">--</span>
                    <span class="text-sm text-gray-500">min</span>
                </div>
            </div>

            <div class="absolute bottom-2 right-2">
                <span id="last-update" class="text-[10px] text-gray-600">WAITING FOR DATA...</span>
            </div>
        </div>

        <div class="border border-green-900 bg-black p-1">
            <div id="map" class="h-full min-h-[300px] grayscale invert"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map with DARK MODE tiles
        var map = L.map('map').setView([40.60, -111.75], 11);
        
        // Use CartoDB Dark Matter tiles for that "Cyberpunk" look
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap & CartoDB',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // 2. Draw the Canyon Roads (Polylines)
        // Little Cottonwood (SR-210) Coordinates [Lat, Lng]
        var lccRoute = [
            [40.573, -111.795], // Mouth
            [40.576, -111.770],
            [40.589, -111.666], // Snowbird
            [40.584, -111.649]  // Alta
        ];
        
        // Big Cottonwood (SR-190) Coordinates
        var bccRoute = [
            [40.619, -111.787], // Mouth
            [40.638, -111.724], // S-Curve
            [40.605, -111.594], // Solitude
            [40.601, -111.583]  // Brighton
        ];

        // Add lines to map
        var lccPoly = L.polyline(lccRoute, {color: 'red', weight: 4, opacity: 0.7}).addTo(map).bindPopup("Little Cottonwood (SR-210)");
        var bccPoly = L.polyline(bccRoute, {color: 'blue', weight: 4, opacity: 0.7}).addTo(map).bindPopup("Big Cottonwood (SR-190)");

        // 3. The Logic to Fetch Data
        async function updateDashboard() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Data file not found");
                const data = await response.json();

                // Update Text
                document.getElementById('lcc-time').innerText = data.lcc_travel_time || "--";
                document.getElementById('bcc-time').innerText = data.bcc_travel_time || "--";
                
                // Update Status & Colors
                updateStatus('lcc-status', data.lcc_status, lccPoly);
                updateStatus('bcc-status', data.bcc_status, bccPoly);
                
                document.getElementById('last-update').innerText = "LAST_SYNC: " + (data.last_updated || "UNKNOWN");
            } catch (error) {
                console.log("Waiting for data...");
            }
        }

        function updateStatus(elementId, status, mapPolyline) {
            const el = document.getElementById(elementId);
            el.innerText = status || "UNKNOWN";
            
            // Reset classes
            el.className = "px-2 py-1 font-bold text-sm tracking-widest border border-gray-600";
            
            // Logic for Colors (Status Box AND Map Line)
            if (status === "OPEN" || status === "Clear") {
                el.classList.add("bg-green-900", "text-white");
                mapPolyline.setStyle({color: '#00ff41'}); // Green Line
            } else if (status === "DELAY" || status === "Heavy") {
                el.classList.add("bg-yellow-600", "text-black");
                mapPolyline.setStyle({color: 'yellow'}); // Yellow Line
            } else if (status === "CLOSED" || status === "RESTRICTED") {
                el.classList.add("bg-red-900", "text-white");
                mapPolyline.setStyle({color: 'red'}); // Red Line
            } else {
                el.classList.add("bg-gray-800", "text-gray-400");
                mapPolyline.setStyle({color: 'gray'});
            }
        }

        setInterval(updateDashboard, 60000);
        updateDashboard(); 
    </script>
</body>
</html>
