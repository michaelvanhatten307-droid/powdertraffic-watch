<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowderTraffic Watch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #0a0a0a; color: #00ff41; font-family: monospace; }
        #map { height: 100%; width: 100%; border: 1px solid #14532d; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .live-indicator { animation: pulse 2s infinite; }
        .camera-feed:hover { border-color: #00ff41; cursor: pointer; }
        .leaflet-popup-content-wrapper { background: #000; color: #00ff41; border: 1px solid #00ff41; font-family: monospace; }
        .leaflet-popup-tip { background: #00ff41; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #14532d; }
    </style>
</head>
<body class="p-4 max-w-6xl mx-auto">
    
    <header class="mb-8 border-b border-green-900 pb-4 flex justify-between items-end">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-tighter text-white">POWDERTRAFFIC//WATCH</h1>
            <p class="text-xs text-green-600 tracking-[0.2em]">LIVE CANYON MONITORING SYSTEM // V3.0</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-gray-400">SYSTEM_STATUS: <span class="text-green-500">ACTIVE</span></p>
            <span class="live-indicator inline-block w-2 h-2 bg-red-500 rounded-full"></span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="border border-green-900 p-6 bg-black/50 relative">
            <h2 class="text-xl mb-6 underline decoration-green-700 decoration-2 underline-offset-8 uppercase">Canyon_Status</h2>
            
            <div class="flex justify-between items-center mb-8 border-b border-green-900/30 pb-6">
                <div>
                    <p class="text-[10px] text-gray-500 mb-2 uppercase">SR-210 (LITTLE COTTONWOOD)</p>
                    <span id="lcc-status" class="px-3 py-1 bg-gray-800 text-gray-400 font-bold text-sm tracking-widest border border-gray-600 uppercase">SYNCING...</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-500 mb-1 italic">STREAM_HZ</p>
                    <span class="text-3xl font-bold text-white italic">60</span>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <div>
                    <p class="text-[10px] text-gray-500 mb-2 uppercase">SR-190 (BIG COTTONWOOD)</p>
                    <span id="bcc-status" class="px-3 py-1 bg-gray-800 text-gray-400 font-bold text-sm tracking-widest border border-gray-600 uppercase">SYNCING...</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-gray-500 mb-1 italic">STREAM_HZ</p>
                    <span class="text-3xl font-bold text-white italic">60</span>
                </div>
            </div>
            
            <div class="mt-8">
                <p id="last-update" class="text-[10px] text-gray-600 font-mono tracking-widest uppercase">INITIALIZING_DATA_FETCH...</p>
            </div>
        </div>

        <div class="border border-green-900 bg-black p-1 h-80 relative">
            <div class="absolute top-2 left-2 z-[1000] bg-black/80 px-2 py-1 border border-green-900 text-[9px] text-green-500 font-bold tracking-tighter">MAP_SURVEILLANCE_ACTIVE</div>
            <div id="map"></div>
        </div>
    </div>

    <div class="mt-6 border border-green-900 bg-black p-6">
        <h3 class="text-lg mb-4 underline decoration-green-700 decoration-2 underline-offset-4 uppercase tracking-widest text-white italic">Canyon_Surveillance_Grid</h3>
        <div id="cam-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([40.60, -111.70], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB'
        }).addTo(map);

        const bccRoute = [[40.620,-111.789],[40.621,-111.775],[40.631,-111.745],[40.641,-111.710],[40.650,-111.665],[40.638,-111.622],[40.605,-111.583]];
        const lccRoute = [[40.572,-111.795],[40.571,-111.755],[40.571,-111.715],[40.575,-111.685],[40.589,-111.645],[40.591,-111.633]];
        
        var bccPoly = L.polyline(bccRoute, {color: '#444', weight: 5, opacity: 0.8}).addTo(map);
        var lccPoly = L.polyline(lccRoute, {color: '#444', weight: 5, opacity: 0.8}).addTo(map);

        let cameraLayer = L.layerGroup().addTo(map);

        async function updateDashboard() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();

                updateStatus('lcc-status', data.canyons.lcc.status, lccPoly);
                updateStatus('bcc-status', data.canyons.bcc.status, bccPoly);
                
                document.getElementById('last-update').innerText = "LAST_SYNC: " + data.metadata.last_updated;

                updateCameraSystem(data.cameras);

            } catch (error) {
                console.log("WAITING_FOR_DATA_PACKETS...");
            }
        }

        function updateStatus(elementId, status, poly) {
            const el = document.getElementById(elementId);
            el.innerText = status.toUpperCase();
            
            if (status.includes("Dry") || status.includes("Clear")) {
                el.className = "px-3 py-1 bg-green-900/20 text-[#00ff41] font-bold text-sm tracking-widest border border-[#00ff41]";
                poly.setStyle({color: '#00ff41', opacity: 1});
            } else if (status.includes("Wet") || status.includes("Fair")) {
                el.className = "px-3 py-1 bg-yellow-900/20 text-yellow-400 font-bold text-sm tracking-widest border border-yellow-500";
                poly.setStyle({color: '#fbbf24', opacity: 1});
            } else {
                el.className = "px-3 py-1 bg-red-900/20 text-red-500 font-bold text-sm tracking-widest border border-red-500";
                poly.setStyle({color: '#ef4444', opacity: 1});
            }
        }

        function updateCameraSystem(cameras) {
            cameraLayer.clearLayers();
            const grid = document.getElementById('cam-grid');
            grid.innerHTML = ""; 

            cameras.forEach((cam, index) => {
                // Add Marker to Map
                L.circleMarker([cam.lat, cam.lng], {
                    radius: 5, fillColor: "#00ff41", color: "#000", weight: 1, fillOpacity: 1
                }).bindPopup(`
                    <div style="color:#00ff41; background:#000; padding:5px; font-family:monospace;">
                        <b style="font-size:10px;">${cam.name}</b><br>
                        <a href="${cam.link}" target="_blank">
                            <img src="${cam.image}" referrerpolicy="no-referrer" width="200" style="margin-top:5px; border:1px solid #14532d;">
                        </a>
                        <p style="font-size:8px; margin-top:4px; color:#666;">[CLICK IMAGE FOR LIVE FEED]</p>
                    </div>`).addTo(cameraLayer);

                // Add to Surveillance Grid (First 4)
                if (index < 4) {
                    grid.innerHTML += `
                        <div class="camera-feed border border-green-900 bg-gray-900 overflow-hidden flex flex-col group">
                            <div class="bg-green-900/80 text-black text-[9px] px-2 py-1 font-bold flex justify-between uppercase">
                                <span class="truncate pr-2">${cam.route} // ${cam.name}</span>
                                <span class="group-hover:text-white flex-shrink-0">● LIVE</span>
                            </div>
                            <a href="${cam.link}" target="_blank" class="block bg-black">
                                <img src="${cam.image}" 
                                     referrerpolicy="no-referrer"
                                     onerror="this.src='https://placehold.co/400x225/000000/00ff41?text=FEED_OFFLINE'"
                                     class="w-full grayscale hover:grayscale-0 transition-all duration-500 opacity-70 group-hover:opacity-100">
                            </a>
                        </div>`;
                }
            });
        }

        setInterval(updateDashboard, 30000);
        updateDashboard();
    </script>
</body>
</html>
